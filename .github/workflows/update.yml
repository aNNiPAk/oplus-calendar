name: Update OPlus calendar
on:
  push:
    branches: [main]
    paths: [.github/workflows/update.yml]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Scan donor OTAs without publishing
        type: boolean
        default: true
      max_donors:
        description: Maximum number of donor OTAs
        type: number
        default: 6
permissions:
  contents: write
jobs:
  update:
    uses: aNNiPAk/oplus-stock-app-bot/.github/workflows/update-stock-app.yml@main
    with:
      package_name: com.oplus.calendar
      max_donors: ${{ inputs.max_donors || 6 }}
      stable_locale: ru
      fallback_locale: en
      major_os: '16'
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
