name: Publish OPlus calendar from suite
on:
  push:
    branches: [main]
    paths: [.github/workflows/update.yml]
  schedule:
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify selected APK from the central suite without publishing
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  update:
    uses: aNNiPAk/oplus-stock-app-bot/.github/workflows/consume-suite.yml@main
    with:
      package_name: com.oplus.calendar
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
